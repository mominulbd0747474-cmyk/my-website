<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Money - Watch & Earn</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; padding: 15px; }
        .header { background: #2c3e50; color: white; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
        .balance-box { font-size: 20px; font-weight: bold; margin-top: 5px; color: #2ecc71; }
        
        /* Video Grid */
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .card { background: white; padding: 10px; border-radius: 8px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h4 { font-size: 14px; margin-bottom: 8px; color: #333; }
        .btn-watch { background: #e74c3c; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        .btn-watch:disabled { background: #bdc3c7; cursor: not-allowed; }

        /* Modal / Ad Popup */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 10px; text-align: center; width: 90%; max-width: 400px; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #e74c3c; display: none; font-weight: bold; }
        .timer { font-size: 18px; color: #333; margin: 15px 0; font-weight: bold; }

        /* Withdraw Section */
        .withdraw-section { background: white; padding: 15px; margin-top: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .withdraw-section input, .withdraw-section select { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; }
        .btn-withdraw { background: #27ae60; color: white; border: none; padding: 10px; width: 100%; font-weight: bold; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Micro Earnings Platform</h2>
        <div class="balance-box">ব্যালেন্স: <span id="userBalance">0.000</span> ৳</div>
    </div>

    <h3>ভিডিও গ্যালারি (১০০ টি)</h3>
    <br>
    <div class="grid-container" id="videoGrid"></div>

    <!-- Withdraw Section -->
    <div class="withdraw-section">
        <h3>টাকা তুলুন (Minimum: 100 ৳)</h3>
        <select id="method">
            <option value="bkash">বিকাশ (Bkash)</option>
            <option value="nagad">নগদ (Nagad)</option>
        </select>
        <input type="text" id="accountNo" placeholder="মোবাইল নম্বর দিন">
        <input type="number" id="amount" placeholder="পরিমাণ (টাকা)">
        <button class="btn-withdraw" onclick="withdraw()">উইথড্র রিকোয়েস্ট</button>
    </div>

    <!-- Video Watch Modal -->
    <div class="modal" id="videoModal">
        <div class="modal-content">
            <span class="close-btn" id="closeBtn" onclick="claimReward()">&times;</span>
            <h3 id="modalTitle">ভিডিও দেখা হচ্ছে...</h3>
            <p style="margin-top: 10px; font-size: 13px; color: #666;">বিজ্ঞাপনের পেজটি খোলা রাখা জরুরি।</p>
            <div class="timer" id="timerText">১৫ সেকেন্ড অপেক্ষা করুন...</div>
        </div>
    </div>

    <script>
        const AD_LINK = "https://www.effectivecpmnetwork.com/rxpxf1ikn?key=14d3589a10b3e9d095c578a9e5a2d70e";
        const REWARD = 0.005;
        let balance = parseFloat(localStorage.getItem('balance')) || 0;
        let currentVideoId = null;
        let countdown = 15;
        let timerInterval = null;

        document.getElementById('userBalance').innerText = balance.toFixed(3);

        // Render 100 Video Cards
        const grid = document.getElementById('videoGrid');
        for (let i = 1; i <= 100; i++) {
            const isWatched = localStorage.getItem(`video_${i}`) === 'true';
            grid.innerHTML += `
                <div class="card">
                    <h4>ভিডিও #${i}</h4>
                    <p style="font-size: 12px; color: #27ae60; margin-bottom: 5px;">+0.005 ৳</p>
                    <button class="btn-watch" id="btn_${i}" onclick="startTask(${i})" ${isWatched ? 'disabled' : ''}>
                        ${isWatched ? 'সম্পন্ন' : 'ভিডিও দেখুন'}
                    </button>
                </div>
            `;
        }

        function startTask(videoId) {
            currentVideoId = videoId;
            countdown = 15;
            
            // Open Ad in a new tab
            window.open(AD_LINK, '_blank');

            // Open Timer Modal
            document.getElementById('videoModal').style.display = 'flex';
            document.getElementById('closeBtn').style.display = 'none';
            document.getElementById('timerText').innerText = `${countdown} সেকেন্ড অপেক্ষা করুন...`;

            // Start Timer
            timerInterval = setInterval(() => {
                countdown--;
                document.getElementById('timerText').innerText = `${countdown} সেকেন্ড অপেক্ষা করুন...`;
                
                if (countdown <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('timerText').innerText = "সময় শেষ! ক্রস (❌) বাটনে চাপ দিয়ে রিওয়ার্ড নিন।";
                    document.getElementById('closeBtn').style.display = 'block';
                }
            }, 1000);
        }

        function claimReward() {
            // Update Balance
            balance += REWARD;
            localStorage.setItem('balance', balance);
            document.getElementById('userBalance').innerText = balance.toFixed(3);

            // Mark Video as Watched
            localStorage.setItem(`video_${currentVideoId}`, 'true');
            const btn = document.getElementById(`btn_${currentVideoId}`);
            btn.disabled = true;
            btn.innerText = "সম্পন্ন";

            // Close Modal
            document.getElementById('videoModal').style.display = 'none';
            alert("অভিনন্দন! আপনার একাউন্টে ০.০০৫ টাকা যোগ করা হয়েছে।");
        }

        function withdraw() {
            const amount = parseFloat(document.getElementById('amount').value);
            const account = document.getElementById('accountNo').value;

            if (!account) {
                alert("দয়া করে বিকাশ বা নগদ নম্বর দিন।");
                return;
            }
            if (amount < 100) {
                alert("সর্বনিম্ন উইথড্র ১০০ টাকা।");
                return;
            }
            if (amount > balance) {
                alert("আপনার একাউন্টে পর্যাপ্ত ব্যালেন্স নেই।");
                return;
            }

            balance -= amount;
            localStorage.setItem('balance', balance);
            document.getElementById('userBalance').innerText = balance.toFixed(3);
            alert("আপনার উইথড্র রিকোয়েস্ট সফল হয়েছে!");
        }
    </script>
</body>
</html>
